---
name: release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  assets:
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout the tag"
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: "Set up Python"
        uses: actions/setup-python@v7
        with:
          python-version: "3.15"

      - name: "Check the README badge names this version"
        run: grep -q "badge/release-${{ github.event.release.tag_name }}-" README.md

      - name: "Build the wheel and the sdist"
        run: |
          python -m pip install build
          python -m build -o dist

      - name: "Attach them to the release"
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/* --clobber
