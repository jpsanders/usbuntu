---
name: ci

on:
  push:
    branches:
      - 'main'
  pull_request:
    branches:
      - '*'
  # Run CI manually
  workflow_dispatch:

jobs:
  lint:
    uses: "./.github/workflows/python-checks.yml"
    with:
      python-version: "3.15"

  test:
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.14", "3.15"]
    uses: "./.github/workflows/python-tests.yml"
    with:
      python-version: ${{ matrix.python-version }}

  # Proves the built wheel installs on its own and runs the commands that need no root.
  package:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout code"
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: "Set up Python"
        uses: actions/setup-python@v7
        with:
          python-version: "3.15"

      - name: "Build the wheel and the sdist"
        run: |
          python -m pip install build
          python -m build -o dist

      - name: "Install the wheel in a clean environment and run it"
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install dist/*.whl
          cd /tmp
          /tmp/clean/bin/usbuntu --version
          /tmp/clean/bin/usbuntu devices --json
          /tmp/clean/bin/usbuntu guide | head -3
          /tmp/clean/bin/usbuntu man --raw | head -1
